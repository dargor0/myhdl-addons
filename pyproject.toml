[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "myhdl-addons"
version = "0.1.0.dev0"
description = "Wishbone library and MyHDL add-ons for building modular hardware systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "LGPL-2.1-or-later"}
authors = [
    {name = "Oscar Diaz", email = "odiaz@ieee.org"},
]
keywords = ["myhdl", "wishbone", "hdl", "soc", "fpga", "bus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

dependencies = [
    "myhdl>=0.11,<0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "coverage>=7.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/dargor0/myhdl-addons"
Source = "https://github.com/dargor0/myhdl-addons"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--tb=short"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Lint for real errors plus the modernization/style rules adopted by the
# project.  `ruff format` owns formatting.
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF", "SIM", "RET"]
