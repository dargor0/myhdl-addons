; Minimal self-contained core: a single internal RAM region, no bus.
; C is enabled by default (no [extension.*] section means the default).

[core]
name = tiny
reset_vector = 0x00000000
tohost   = 0x00001000
fromhost = 0x00001004

[region.ram]
base   = 0x00000000
size   = 0x00010000
perms  = ID
access = RW
target = internal
