; Example RISC-V core configuration (MCU with two external buses).
; See CONFIG.md for the schema.

[core]
name = mcu0
reset_vector = 0x00000000
tohost   = 0x00010000
fromhost = 0x00010004
interrupts = false

[isa]
base = rv32i

[extension.c]
enabled = true

[registers]
count = 32

[pipeline]
stages = 3
fetch_buffer = 1
forwarding = false

[bus.mem]
type = wishbone

[bus.periph]
type = axi

[region.rom]
base   = 0x00000000
size   = 0x00004000
perms  = I
access = RO
target = internal
init        = ../share/riscv_firmware.hex
init_format = hex

[region.sram]
base   = 0x00010000
size   = 0x00004000
perms  = ID
access = RW
target = internal

[region.dram]
base   = 0x40000000
size   = 0x10000000
perms  = ID
access = RW
target = bus:mem

[region.periph]
base   = 0x80000000
size   = 0x00100000
perms  = D
access = RW
target = bus:periph

[debug]
trace = false
